name = "LanguageJavascript"
defaultTargets = [
  "LanguageJavascript",
  "LanguageJavascriptMini",
  "LanguageJavascriptBrujin",
]

[[lean_lib]]
name = "LanguageJavascript"
globs = ["LanguageJavascript.+"]

[[lean_lib]]
name = "LanguageJavascriptMini"
globs = ["LanguageJavascriptMini.+"]

[[lean_lib]]
name = "LanguageJavascriptBrujin"
globs = ["LanguageJavascriptBrujin.+"]

[[lean_exe]]
name = "tests"
root = "LanguageJavascriptTests.Main"

[[lean_exe]]
name = "bench"
root = "LanguageJavascriptBench.Main"

[[require]]
name = "Regex"
git = "https://github.com/pandaman64/lean-regex"
rev = "main"
subDir = "regex"
